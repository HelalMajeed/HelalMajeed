<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="425" viewBox="0 0 1000 425" role="img" aria-labelledby="title desc">
      <title id="title">What I am exploring</title><desc id="desc">Agentic tutoring that connects explanation, practice and feedback. Natural voice interfaces. Retrieval and evaluation that make AI answers more dependable.</desc>
      <defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#51685c" opacity=".12"/></pattern>
      <linearGradient id="edge"><stop stop-color="#426b20"/><stop offset=".5" stop-color="#237d68"/><stop offset="1" stop-color="#c8d8ca"/></linearGradient>
      <clipPath id="frame"><rect x="1" y="1" width="998" height="423" rx="20"/></clipPath></defs>
      <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#192c25}
      .muted{fill:#51685c}.mono{font-family:'Courier New',monospace;letter-spacing:1.3px}
      .compact{display:none}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
      @keyframes eyes{0%,42%,47%,100%{transform:scaleY(1)}44%,45%{transform:scaleY(.18)}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes trace{to{stroke-dashoffset:-180}}
      @keyframes wave{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
      .float{animation:float 5s ease-in-out infinite}
      .pulse{animation:pulse 4s ease-in-out infinite}
      .eyes{transform-origin:90px 88px;animation:eyes 8s ease-in-out infinite}
      .spin{animation:spin 35s linear infinite}
      .trace{animation:trace 10s linear infinite}
      .wave{animation:wave 1.8s ease-in-out infinite}
      @media(max-width:600px){.wide{display:none}.compact{display:inline}}
      @media(prefers-reduced-motion:reduce){.float,.pulse,.eyes,.spin,.trace,.wave{animation:none!important}}
    </style><g clip-path="url(#frame)">
      <rect x="0" y="0" width="1000" height="425" rx="20" fill="#f4f7f1" stroke="none" /><rect width="1000" height="425" fill="url(#dots)"/>
      <path d="M30 1H970" stroke="url(#edge)" stroke-width="2" opacity=".7"/>
      <g class="wide"><text x="38" y="44" font-size="16" class="mono" style="fill:#237d68" >05 / EXPLORING NEXT</text><text x="38" y="109" font-size="45" class=""  font-weight="700" >Better ways to interact.</text><path d="M195 205H805" fill="none" stroke="#c8d8ca" stroke-width="2"/><path d="M195 205H805" class="trace" stroke="#237d68" stroke-width="2" stroke-dasharray="35 145"/><g transform="translate(133 153)"><g transform="scale(0.5833333333333334)"><circle cx="90" cy="90" r="79" fill="#e9f0e5" stroke="#c8d8ca"/><circle cx="90" cy="90" r="88" fill="none" stroke="#c8d8ca" stroke-dasharray="2 9"/><path d="M90 49V79H45V123M90 79H135V123" fill="none" stroke="#c8d8ca" stroke-width="3"/>
