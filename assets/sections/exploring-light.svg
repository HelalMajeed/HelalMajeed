ght="62" rx="10" fill="none" stroke="#426b20" stroke-dasharray="18 8" class="trace"/><text x="90" y="101" font-size="30" class="" style="fill:#426b20" font-weight="700" text-anchor="middle">AI</text></g></g><text x="827" y="307" font-size="26" class=""  font-weight="700" text-anchor="middle">Reliable answers</text><text x="827" y="346" font-size="21" class="muted"  text-anchor="middle">Better retrieval.</text><text x="827" y="377" font-size="21" class="muted"  text-anchor="middle">Stronger evaluation.</text></g><g class="compact"><text x="38" y="51" font-size="27" class="mono" style="fill:#237d68" >05 / EXPLORING NEXT</text><text x="38" y="119" font-size="51" class=""  font-weight="700" >Better ways to interact.</text><text x="40" y="210" font-size="43" class="muted"  >01   Agentic tutoring</text><text x="40" y="281" font-size="43" class="muted"  >02   Natural voice</text><text x="40" y="352" font-size="43" class="muted"  >03   Reliable AI answers</text><g transform="translate(772 157)"><g transform="scale(0.9444444444444444)"><circle cx="90" cy="90" r="79" fill="#e9f0e5" stroke="#c8d8ca"/><circle cx="90" cy="90" r="88" fill="none" stroke="#c8d8ca" stroke-dasharray="2 9"/><circle cx="90" cy="90" r="13" fill="#426b20"/><circle cx="90" cy="90" r="31" fill="none" stroke="#237d68" opacity="0.85" class="pulse" style="animation-delay:0.0s"/><circle cx="90" cy="90" r="50" fill="none" stroke="#237d68" opacity="0.5" class="pulse" style="animation-delay:0.5s"/><circle cx="90" cy="90" r="68" fill="none" stroke="#237d68" opacity="0.25" class="pulse" style="animation-delay:1.0s"/></g></g></g></g>
