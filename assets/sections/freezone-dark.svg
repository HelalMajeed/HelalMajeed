<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
      <title id="title">FREEZONE — project</title><desc id="desc">FREEZONE. Storefront, management dashboard, and a connected commerce API. TYPESCRIPT, REACT, NODE.JS. Open the public repository.</desc>
      <defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#a5b6c3" opacity=".12"/></pattern>
      <linearGradient id="edge"><stop stop-color="#c6f88b"/><stop offset=".5" stop-color="#71d9c2"/><stop offset="1" stop-color="#273847"/></linearGradient>
      <clipPath id="frame"><rect x="1" y="1" width="998" height="258" rx="20"/></clipPath></defs>
      <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#eef4f2}
      .muted{fill:#a5b6c3}.mono{font-family:'Courier New',monospace;letter-spacing:1.3px}
      .compact{display:none}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
      @keyframes eyes{0%,42%,47%,100%{transform:scaleY(1)}44%,45%{transform:scaleY(.18)}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes trace{to{stroke-dashoffset:-180}}
      @keyframes wave{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
      .float{animation:float 5s ease-in-out infinite}
      .pulse{animation:pulse 4s ease-in-out infinite}
      .eyes{transform-origin:90px 88px;animation:eyes 8s ease-in-out infinite}
      .spin{animation:spin 35s linear infinite}
      .trace{animation:trace 10s linear infinite}
      .wave{animation:wave 1.8s ease-in-out infinite}
      @media(max-width:600px){.wide{display:none}.compact{display:inline}}
      @media(prefers-reduced-motion:reduce){.float,.pulse,.eyes,.spin,.trace,.wave{animation:none!important}}
    </style><g clip-path="url(#frame)">
