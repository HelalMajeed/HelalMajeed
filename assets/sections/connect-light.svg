<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
      <title id="title">Connect with Crescent</title><desc id="desc">Interested in AI, education or useful software? Connect with Helal Majeed on LinkedIn.</desc>
      <defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#51685c" opacity=".12"/></pattern>
      <linearGradient id="edge"><stop stop-color="#426b20"/><stop offset=".5" stop-color="#237d68"/><stop offset="1" stop-color="#c8d8ca"/></linearGradient>
      <clipPath id="frame"><rect x="1" y="1" width="998" height="298" rx="20"/></clipPath></defs>
      <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#192c25}
      .muted{fill:#51685c}.mono{font-family:'Courier New',monospace;letter-spacing:1.3px}
      .compact{display:none}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
      @keyframes eyes{0%,42%,47%,100%{transform:scaleY(1)}44%,45%{transform:scaleY(.18)}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes trace{to{stroke-dashoffset:-180}}
      @keyframes wave{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
      .float{animation:float 5s ease-in-out infinite}
      .pulse{animation:pulse 4s ease-in-out infinite}
      .eyes{transform-origin:90px 88px;animation:eyes 8s ease-in-out infinite}
      .spin{animation:spin 35s linear infinite}
      .trace{animation:trace 10s linear infinite}
      .wave{animation:wave 1.8s ease-in-out infinite}
      @media(max-width:600px){.wide{display:none}.compact{display:inline}}
      @media(prefers-reduced-motion:reduce){.float,.pulse,.eyes,.spin,.trace,.wave{animation:none!important}}
    </style><g clip-path="url(#frame)">
      <rect x="0" y="0" width="1000" height="300" rx="20" fill="#f4f7f1" stroke="none" /><rect width="1000" height="300" fill="url(#dots)"/>
      <path d="M30 1H970" stroke="url(#edge)" stroke-width="2" opacity=".7"/>
      <g class="wide"><text x="38" y="44" font-size="16" class="mono" style="fill:#237d68" >06 / CONNECT</text><text x="38" y="113" font-size="43" class=""  font-weight="700" >Let’s build something useful.</text><text x="40" y="160" font-size="24" class="muted"  >AI, education, and thoughtful software.</text><rect x="40" y="202" width="279" height="49" rx="24" fill="#426b20" stroke="none" /><text x="63" y="233" font-size="16" class="mono" style="fill:#f4f7f1" font-weight="700" >CONNECT ON LINKEDIN</text><g transform="translate(284 217) scale(0.65)" fill="none" stroke="#f4f7f1" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M0 18L18 0M0 0H18V18"/></g><g transform="translate(810 59)"><g transform="scale(0.8333333333333334)"><circle cx="90" cy="90" r="79" fill="#e9f0e5" stroke="#c8d8ca"/><circle cx="90" cy="90" r="88" fill="none" stroke="#c8d8ca" stroke-dasharray="2 9"/><g class="float"><rect x="28" y="42" width="124" height="99" rx="14" fill="#f4f7f1" stroke="#237d68" stroke-width="2.5"/>
          <path d="M28 65H152" stroke="#c8d8ca"/><g fill="#51685c"><circle cx="42" cy="54" r="3"/><circle cx="53" cy="54" r="3"/><circle cx="64" cy="54" r="3"/></g>
          <path d="M49 88L62 99L49 110" fill="none" stroke="#426b20" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M78 110H104" class="pulse" stroke="#426b20" stroke-width="4" stroke-linecap="round"/>
          <path d="M112 26L116 36L126 40L116 44L112 54L108 44L98 40L108 36Z" fill="#326aab"/></g></g></g></g><g class="compact"><text x="38" y="50" font-size="27" class="mono" style="fill:#237d68" >06 / CONNECT</text><text x="38" y="124" font-size="50" class=""  >Let’s build something</text><text x="38" y="189" font-size="50" class=""  >useful together.</text><text x="40" y="264" font-size="30" class="mono" style="fill:#426b20" >CONNECT ON LINKEDIN</text><g transform="translate(490 237) scale(1.25)" fill="none" stroke="#426b20" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M0 18L18 0M0 0H18V18"/></g></g></g>
      <rect x=".5" y=".5" width="999" height="299" rx="19.5" fill="none" stroke="#c8d8ca"/>
    </svg>